<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financeiro - AutônomoFácil</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
body{
font-family:Segoe UI;
background:#f4f6f9;
margin:0;
padding:20px;
}

h1{color:#1565c0}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

.home-btn{
background:#1565c0;
color:#fff;
border:none;
padding:10px 12px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.card{
background:#fff;
padding:15px;
border-radius:15px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
margin-bottom:15px;
}

.total{
font-size:20px;
font-weight:bold;
color:#2e7d32;
}

.negativo{
color:#c62828;
}

.item{
padding:10px;
border-bottom:1px solid #eee;
}

.tipo{
font-size:12px;
padding:3px 8px;
border-radius:10px;
color:#fff;
display:inline-block;
margin-top:5px;
}

.recebido{background:#2e7d32}
.despesa{background:#c62828}

.filters{
display:flex;
gap:10px;
margin-bottom:15px;
}

select{
flex:1;
padding:10px;
border-radius:10px;
border:1px solid #ddd;
}
</style>
</head>

<body>

<div class="topbar">
<h1>💰 Financeiro</h1>

<button class="home-btn" onclick="location.href='index.html'">
<i class="fa fa-home"></i> Início
</button>
</div>

<div class="card">
<div>Total recebido:</div>
<div class="total" id="totalRecebido">R$ 0,00</div>

<br>

<div>Total despesas:</div>
<div class="total negativo" id="totalDespesas">R$ 0,00</div>

<br>

<div>💰 Lucro líquido:</div>
<div class="total" id="lucro">R$ 0,00</div>
</div>

<div class="card">

<h3>📅 Filtro por mês</h3>

<div class="filters">
<select id="filtroMes" onchange="renderizar()">
<option value="">Todos os meses</option>
</select>
</div>

</div>

<div class="card">
<h3>📊 Lançamentos</h3>
<div id="lista"></div>
</div>

<script>

let lancamentos = JSON.parse(localStorage.getItem("lancamentosFinanceiros")) || [];

// ----------------------
// GERAR MESES
// ----------------------
function gerarMeses(){

let select = document.getElementById("filtroMes");
let meses = new Set();

lancamentos.forEach(l=>{
if(l.data){
let mes = l.data.slice(3,10); // MM/AAAA
meses.add(mes);
}
});

meses.forEach(m=>{
select.innerHTML += `<option value="${m}">${m}</option>`;
});
}

// ----------------------
// CALCULAR TOTAIS
// ----------------------
function calcularTotais(lista){

let recebido = 0;
let despesa = 0;

lista.forEach(l=>{
if(l.tipo === "recebido") recebido += Number(l.valor || 0);
if(l.tipo === "despesa") despesa += Number(l.valor || 0);
});

document.getElementById("totalRecebido").innerText =
"R$ " + recebido.toFixed(2).replace(".", ",");

document.getElementById("totalDespesas").innerText =
"R$ " + despesa.toFixed(2).replace(".", ",");

document.getElementById("lucro").innerText =
"R$ " + (recebido - despesa).toFixed(2).replace(".", ",");
}

// ----------------------
// RENDERIZAR
// ----------------------
function renderizar(){

const lista = document.getElementById("lista");
lista.innerHTML = "";

let filtro = document.getElementById("filtroMes").value;

let filtrados = lancamentos.filter(l=>{
if(!filtro) return true;
return l.data && l.data.includes(filtro);
});

if(filtrados.length === 0){
lista.innerHTML = "<p>Nenhum lançamento.</p>";
calcularTotais([]);
return;
}

filtrados.forEach(l=>{
lista.innerHTML += `
<div class="item">

<b>${l.textoOriginal || "Lançamento"}</b><br>

💰 R$ ${Number(l.valor || 0).toFixed(2).replace(".", ",")}

<br>

<span class="tipo ${l.tipo}">
${l.tipo.toUpperCase()}
</span>

<br>
<small>${l.data || ""}</small>

</div>
`;
});

calcularTotais(filtrados);
}

// INIT
gerarMeses();
renderizar();

</script>

</body>
</html>
