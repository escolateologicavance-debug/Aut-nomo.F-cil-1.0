<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes - AutônomoFácil</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
body{
font-family:Segoe UI;
background:#f4f6f9;
margin:0;
padding:20px;
}

h1{
color:#1565c0;
margin-bottom:10px;
}

.form{
background:#fff;
padding:15px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
margin-bottom:20px;
}

input, select{
width:100%;
padding:10px;
margin:8px 0;
border-radius:10px;
border:1px solid #ddd;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#1565c0;
color:#fff;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#0d47a1;
}

.card{
background:#fff;
padding:15px;
border-radius:15px;
margin-bottom:12px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card h3{
margin:0;
}

.actions{
display:flex;
gap:10px;
margin-top:10px;
}

.actions button{
flex:1;
font-size:12px;
}

.whats{
background:#25D366;
}

.delete{
background:#c62828;
}

.status{
font-size:12px;
padding:3px 8px;
border-radius:10px;
color:#fff;
display:inline-block;
margin-top:5px;
}

.ativo{background:#2e7d32;}
.inativo{background:#777;}

.search{
margin-bottom:15px;
}
</style>
</head>

<body>

<h1>📁 Clientes</h1>

<div class="form">
<input id="nome" placeholder="Nome do cliente">
<input id="telefone" placeholder="Telefone (ex: 55999999999)">
<select id="status">
<option value="ativo">Ativo</option>
<option value="inativo">Inativo</option>
</select>

<button onclick="salvarCliente()">Salvar Cliente</button>
</div>

<input class="search" id="busca" placeholder="Buscar cliente..." oninput="renderizar()">

<div id="lista"></div>

<script>

let clientes = JSON.parse(localStorage.getItem("clientes")) || [];

function salvarCliente(){

const nome = document.getElementById("nome").value.trim();
const telefone = document.getElementById("telefone").value.trim();
const status = document.getElementById("status").value;

if(!nome || !telefone){
alert("Preencha nome e telefone");
return;
}

clientes.unshift({
id:Date.now(),
nome,
telefone,
status,
data:new Date().toLocaleString("pt-BR")
});

localStorage.setItem("clientes", JSON.stringify(clientes));

document.getElementById("nome").value="";
document.getElementById("telefone").value="";

renderizar();
}

function deletar(id){
clientes = clientes.filter(c => c.id !== id);
localStorage.setItem("clientes", JSON.stringify(clientes));
renderizar();
}

function whatsapp(telefone, nome){

const msg = encodeURIComponent("Olá " + nome + ", tudo bem?");
const url = `https://wa.me/${telefone}?text=${msg}`;
window.open(url, "_blank");

}

function renderizar(){

const lista = document.getElementById("lista");
const busca = document.getElementById("busca").value.toLowerCase();

lista.innerHTML="";

let filtrados = clientes.filter(c =>
c.nome.toLowerCase().includes(busca)
);

if(filtrados.length === 0){
lista.innerHTML = "<p>Nenhum cliente encontrado.</p>";
return;
}

filtrados.forEach(c => {

lista.innerHTML += `
<div class="card">
<h3>${c.nome}</h3>

<div class="status ${c.status}">
${c.status.toUpperCase()}
</div>

<p>📞 ${c.telefone}</p>
<small>${c.data}</small>

<div class="actions">
<button class="whats" onclick="whatsapp('${c.telefone}','${c.nome}')">
<i class="fa-brands fa-whatsapp"></i> Whats
</button>

<button class="delete" onclick="deletar(${c.id})">
<i class="fa fa-trash"></i>
</button>
</div>
</div>
`;

});

}

renderizar();

</script>

</body>
</html>
