<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes - AutônomoFácil</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root{
--primary:#1565c0;
--primary-dark:#0d47a1;
--bg:#f4f6f9;
--text:#222;
--white:#ffffff;
--green:#2e7d32;
--red:#c62828;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}

body{
background:var(--bg);
color:var(--text);
padding-bottom:90px;
}

header{
background:linear-gradient(135deg,var(--primary),var(--primary-dark));
color:white;
padding:20px;
display:flex;
align-items:center;
justify-content:space-between;
position:relative;
}

header .btn-voltar{
color:white;
text-decoration:none;
font-size:16px;
display:flex;
align-items:center;
gap:8px;
}

header h2{
position:absolute;
right:20px;
font-size:24px;
font-weight:bold;
}

.section-title{
padding:20px 15px 5px;
font-size:18px;
font-weight:700;
color:#333;
}

.card{
background:white;
padding:15px;
border-radius:15px;
margin:10px 15px;
box-shadow:0 2px 8px rgba(0,0,0,0.05);
}

.form-group{
margin-bottom:12px;
}

.form-group label{
display:block;
font-size:12px;
font-weight:600;
margin-bottom:4px;
color:#666;
}

.form-group input{
width:100%;
padding:10px;
border:1px solid #ddd;
border-radius:8px;
font-size:14px;
outline:none;
}

.form-group input:focus{
border-color:var(--primary);
}

.btn-acao{
width:100%;
background:var(--primary);
color:white;
border:none;
padding:12px;
border-radius:8px;
font-size:15px;
font-weight:bold;
cursor:pointer;
box-shadow:0 3px 6px rgba(21,101,192,0.2);
display:flex;
align-items:center;
justify-content:center;
gap:8px;
}

.btn-acao:active{
background:var(--primary-dark);
}

.busca-container {
margin-bottom:5px;
}

.busca-container input {
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
font-size:14px;
outline:none;
}

.lista-clientes{
margin:10px 15px;
}

.item-cliente{
background:white;
padding:15px;
border-radius:12px;
margin-bottom:10px;
box-shadow:0 2px 5px rgba(0,0,0,0.03);
display:flex;
justify-content:space-between;
align-items:center;
}

.info-cliente h4{
font-size:15px;
color:#222;
margin-bottom:2px;
}

.info-cliente p{
font-size:12px;
color:#666;
}

.btn-excluir{
background:none;
border:none;
color:var(--red);
font-size:16px;
cursor:pointer;
padding:5px;
}

.msg-feedback{
text-align:center;
color:#2e7d32;
font-weight:600;
font-size:14px;
margin-top:8px;
display:none;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:70px;
background:white;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:0 -2px 15px rgba(0,0,0,.12);
z-index:999;
}

.bottom-nav a{
text-decoration:none;
color:#444;
font-size:11px;
text-align:center;
}

.bottom-nav i{
display:block;
font-size:22px;
margin-bottom:4px;
color:var(--primary);
}

.bottom-nav a.active {
color:var(--primary);
font-weight:bold;
}
</style>
</head>
<body>

<header>
<a href="index.html" class="btn-voltar"><i class="fa-solid fa-arrow-left"></i> Voltar</a>
<h2>Clientes</h2>
</header>

<div class="section-title">Cadastrar Novo Cliente</div>
<div class="card">
<div class="form-group">
<label>Nome Completo</label>
<input type="text" id="txtNomeCliente" placeholder="Ex: João Lima">
</div>
<div class="form-group">
<label>Telefone / WhatsApp</label>
<input type="tel" id="txtTelefoneCliente" placeholder="Ex: (65) 99999-9999">
</div>
<div class="form-group">
<label>Cidade / Localidade</label>
<input type="text" id="txtCidadeCliente" placeholder="Ex: Itanhangá - MT">
</div>
<button class="btn-acao" id="btnSalvarCliente"><i class="fa-solid fa-plus"></i> Salvar Cliente</button>
<div id="msgSucessoCliente" class="msg-feedback">✅ Cliente cadastrado com sucesso!</div>
</div>

<div class="section-title">Gerenciar Clientes</div>
<div class="card busca-container">
<input type="text" id="txtBuscaCliente" placeholder="Buscar cliente pelo nome...">
</div>

<div class="lista-clientes" id="containerListaClientes"></div>

<nav class="bottom-nav">
<a href="index.html"><i class="fa-solid fa-house"></i>Início</a>
<a href="index.html"><i class="fa-solid fa-microphone"></i>Voz</a>
<a href="servicos.html"><i class="fa-solid fa-clipboard-list"></i>Serviços</a>
<a href="financeiro.html"><i class="fa-solid fa-wallet"></i>Financeiro</a>
<a href="clientes.html" class="active"><i class="fa-solid fa-users"></i>Clientes</a>
</nav>

<script>
// Elementos da página mapeados com segurança
const inputNome = document.getElementById("txtNomeCliente");
const inputTelefone = document.getElementById("txtTelefoneCliente");
const inputCidade = document.getElementById("txtCidadeCliente");
const botaoSalvar = document.getElementById("btnSalvarCliente");
const feedbackSucesso = document.getElementById("msgSucessoCliente");
const inputBusca = document.getElementById("txtBuscaCliente");
const listaContainer = document.getElementById("containerListaClientes");

// Carrega os dados persistidos imediatamente ao abrir a tela
let clientesCadastrados = JSON.parse(localStorage.getItem("bancoClientesAutonomo")) || [];

// Função que reconstrói a lista visual na tela
function renderizarLista(filtroTexto = "") {
listaContainer.innerHTML = "";

const filtrados = clientesCadastrados.filter(c =>
c.nome.toLowerCase().includes(filtroTexto.toLowerCase())
);

if(filtrados.length === 0) {
listaContainer.innerHTML = '<p style="text-align:center; color:#888; font-size:14px; padding:15px;">Nenhum cliente cadastrado.</p>';
return;
}

filtrados.forEach(cliente => {
const indiceReal = clientesCadastrados.indexOf(cliente);

listaContainer.innerHTML += &lt;div class="item-cliente"&gt; &lt;div class="info-cliente"&gt; &lt;h4&gt;${cliente.nome}</h4>
<p><i class="fa-solid fa-phone" style="font-size:10px;"></i> ${cliente.telefone} | &lt;i class="fa-solid fa-location-dot" style="font-size:10px;"&gt;&lt;/i&gt; ${cliente.cidade}</p>
</div>
<button class="btn-excluir" onclick="removerClienteDoBanco(${indiceReal})"&gt;&lt;i class="fa-solid fa-trash"&gt;&lt;/i&gt;&lt;/button&gt; &lt;/div&gt;;
});
}

// Evento clique do botão Salvar
botaoSalvar.onclick = function() {
const nome = inputNome.value.trim();
const telefone = inputTelefone.value.trim();
const cidade = inputCidade.value.trim();

if(!nome) {
alert("Por favor, preencha o campo 'Nome Completo'.");
return;
}

// Estrutura o objeto de dados
const novoRegistro = {
nome: nome,
telefone: telefone || "Não informado",
cidade: city = cidade || "Não informada"
};

// Insere no início da lista na memória ram
clientesCadastrados.unshift(novoRegistro);

// Salva permanentemente no HD/Memória interna do navegador
localStorage.setItem("bancoClientesAutonomo", JSON.stringify(clientesCadastrados));

// Limpa o formulário na tela
inputNome.value = "";
inputTelefone.value = "";
inputCidade.value = "";

// Exibe o balão verde de confirmação
feedbackSucesso.style.display = "block";
setTimeout(() => {
feedbackSucesso.style.display = "none";
}, 2500);

// Atualiza a listagem visual na hora
renderizarLista();
};

// Função global para excluir o cliente permanentemente
window.removerClienteDoBanco = function(posicao) {
if(confirm("Deseja realmente excluir este cliente da sua lista?")) {
clientesCadastrados.splice(posicao, 1);
localStorage.setItem("bancoClientesAutonomo", JSON.stringify(clientesCadastrados));
renderizarLista(inputBusca.value);
}
};

// Busca dinâmica enquanto o usuário digita
inputBusca.oninput = function() {
renderizarLista(inputBusca.value);
};

// Garante a renderização correta assim que a página termina de carregar
window.onload = function() {
renderizarLista();
};
</script>

</body>
</html>
