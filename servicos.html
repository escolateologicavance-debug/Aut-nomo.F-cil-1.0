<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serviços - AutônomoFácil</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
body{
font-family:Segoe UI;
background:#f4f6f9;
margin:0;
padding:20px;
}

h1{
color:#1565c0;
margin-bottom:10px;
}

.form{
background:#fff;
padding:15px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
margin-bottom:20px;
}

input, textarea, select{
width:100%;
padding:10px;
margin:8px 0;
border-radius:10px;
border:1px solid #ddd;
font-size:14px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#1565c0;
color:#fff;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#0d47a1;
}

.card{
background:#fff;
padding:15px;
border-radius:15px;
margin-bottom:12px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card h3{
margin:0;
color:#222;
}

.price{
font-weight:bold;
color:#2e7d32;
margin-top:5px;
}

.small{
font-size:12px;
color:#666;
margin-top:5px;
}

.actions{
display:flex;
gap:10px;
margin-top:10px;
}

.actions button{
flex:1;
font-size:12px;
}

.delete{
background:#c62828;
}

.edit{
background:#f9a825;
}

.preview{
background:#2e7d32;
}

.tag{
display:inline-block;
padding:3px 8px;
font-size:11px;
border-radius:10px;
background:#eee;
margin-top:5px;
}
</style>
</head>

<body>

<h1>🛠️ Meus Serviços</h1>

<div class="form">
<input id="nome" placeholder="Nome do serviço (ex: Corte de grama)">
<input id="categoria" placeholder="Categoria (ex: Jardineiro, Eletricista)">
<input id="preco" type="number" placeholder="Preço (R$`)">
<textarea id="descricao" placeholder="Descrição do serviço"></textarea>

<button onclick="salvarServico()">Salvar Serviço</button>
</div>

<div id="lista"></div>

<script>

let servicos = JSON.parse(localStorage.getItem("servicos")) || [];

let editandoId = null;

function salvarServico(){

const nome = document.getElementById("nome").value.trim();
const categoria = document.getElementById("categoria").value.trim();
const preco = document.getElementById("preco").value;
const descricao = document.getElementById("descricao").value.trim();

if(!nome || !preco){
alert("Preencha nome e preço");
return;
}

if(editandoId){

servicos = servicos.map(s=>{
if(s.id === editandoId){
return {
...s,
nome,
categoria,
preco,
descricao
};
}
return s;
});

editandoId = null;

}else{

servicos.unshift({
id:Date.now(),
nome,
categoria,
preco,
descricao,
data:new Date().toLocaleString("pt-BR")
});

}

localStorage.setItem("servicos", JSON.stringify(servicos));

limpar();
renderizar();
}

function limpar(){
document.getElementById("nome").value="";
document.getElementById("categoria").value="";
document.getElementById("preco").value="";
document.getElementById("descricao").value="";
}

function deletar(id){
servicos = servicos.filter(s => s.id !== id);
localStorage.setItem("servicos", JSON.stringify(servicos));
renderizar();
}

function editar(id){

const s = servicos.find(x => x.id === id);

document.getElementById("nome").value = s.nome;
document.getElementById("categoria").value = s.categoria;
document.getElementById("preco").value = s.preco;
document.getElementById("descricao").value = s.descricao;

editandoId = id;
}

function preview(s){

const msg = 🛠️${s.nome}
📂 {s.descricao || ""}
`;

alert(msg);
}

function renderizar(){

const lista = document.getElementById("lista");

lista.innerHTML="";

if(servicos.length === 0){
lista.innerHTML = "<p>Nenhum serviço cadastrado ainda.</p>";
return;
}

servicos.forEach(s=>{

lista.innerHTML += `
<div class="card">

<h3>$`{s.nome}</h3>

<span class="tag">`${s.categoria || "Sem categoria"}</span>

<div class="price">Rlatex
 

{s.preco}</div>

<div class="small">$`{s.descricao || ""}</div>

<div class="small">📅 `${s.data}</div>

<div class="actions">

<button class="preview" onclick='preview($`{JSON.stringify(s)})'>
<i class="fa fa-eye"></i>
</button>

<button class="edit" onclick="editar(`${s.id})">
<i class="fa fa-pen"></i>
</button>

<button class="delete" onclick="deletar(${s.id})">
<i class="fa fa-trash"></i>
</button>

</div>

</div>
`;

});

}

renderizar();

</script>

</body>
</html>
