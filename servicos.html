<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serviços - AutônomoFácil</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
body{
font-family:Segoe UI;
background:#f4f6f9;
margin:0;
padding:20px;
}

h1{color:#1565c0}

.form, .card{
background:#fff;
padding:15px;
border-radius:15px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
margin-bottom:15px;
}

input, textarea{
width:100%;
padding:10px;
margin:6px 0;
border-radius:10px;
border:1px solid #ddd;
}

button{
padding:10px;
border:none;
border-radius:10px;
background:#1565c0;
color:#fff;
cursor:pointer;
font-weight:bold;
margin-top:5px;
}

button:hover{background:#0d47a1}

.actions{
display:flex;
gap:10px;
margin-top:10px;
}

.actions button{
flex:1;
font-size:12px;
}

.delete{background:#c62828}
.edit{background:#f9a825}
.preview{background:#2e7d32}

.topbar{
display:flex;
gap:10px;
margin-bottom:15px;
}

.navbtn{
flex:1;
background:#444;
}

.success{
color:#2e7d32;
font-weight:bold;
margin-top:10px;
}
</style>
</head>

<body>

<h1>🛠️ Meus Serviços</h1>

<div class="topbar">
<button class="navbtn" onclick="location.href='index.html'">🏠 Início</button>
<button class="navbtn" onclick="location.href='clientes.html'">👥 Clientes</button>
</div>

<div class="form">
<input id="nome" placeholder="Nome do serviço">
<input id="categoria" placeholder="Categoria">
<input id="preco" placeholder="Preço (ex: 150)">
<textarea id="descricao" placeholder="Descrição"></textarea>

<button onclick="salvarServico()">Salvar Serviço</button>

<div id="msg"></div>
</div>

<div id="lista"></div>

<script>

let servicos = JSON.parse(localStorage.getItem("servicos")) || [];
let editando = null;

function salvarServico(){

console.log("clicou salvar"); // debug

const nome = document.getElementById("nome").value.trim();
const categoria = document.getElementById("categoria").value.trim();
const preco = document.getElementById("preco").value.trim();
const descricao = document.getElementById("descricao").value.trim();

if(nome === "" || preco === ""){
alert("Preencha nome e preço!");
return;
}

if(isNaN(preco)){
alert("Preço precisa ser número!");
return;
}

if(editando){

servicos = servicos.map(s=>{
if(s.id === editando){
return {...s,nome,categoria,preco,descricao};
}
return s;
});

editando = null;

}else{

servicos.unshift({
id:Date.now(),
nome,
categoria,
preco,
descricao,
data:new Date().toLocaleString("pt-BR")
});

}

localStorage.setItem("servicos", JSON.stringify(servicos));

document.getElementById("msg").innerHTML =
"<div class='success'>✔ Serviço salvo com sucesso!</div>";

limpar();
renderizar();
}

function limpar(){
document.getElementById("nome").value="";
document.getElementById("categoria").value="";
document.getElementById("preco").value="";
document.getElementById("descricao").value="";
}

function deletar(id){
servicos = servicos.filter(s=>s.id!==id);
localStorage.setItem("servicos", JSON.stringify(servicos));
renderizar();
}

function editar(id){
const s = servicos.find(x=>x.id===id);
document.getElementById("nome").value=s.nome;
document.getElementById("categoria").value=s.categoria;
document.getElementById("preco").value=s.preco;
document.getElementById("descricao").value=s.descricao;
editando=id;
}

function renderizar(){

const lista = document.getElementById("lista");
lista.innerHTML="";

if(servicos.length===0){
lista.innerHTML="<p>Nenhum serviço cadastrado.</p>";
return;
}

servicos.forEach(s=>{

lista.innerHTML += `
<div class="card">

<h3>${s.nome}</h3>
<p>📂 ${s.categoria}</p>
<p>💰 R$ ${s.preco}</p>
<p>${s.descricao}</p>

<div class="actions">
<button class="preview" onclick="alert('Serviço: ${s.nome}\\nPreço: ${s.preco}')">👁</button>
<button class="edit" onclick="editar(${s.id})">✏️</button>
<button class="delete" onclick="deletar(${s.id})">🗑</button>
</div>

</div>
`;

});

}

renderizar();

</script>

</body>
</html>
