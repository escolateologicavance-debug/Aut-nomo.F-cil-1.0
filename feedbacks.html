<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedbacks - AutônomoFácil</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body {
            font-family: Segoe UI, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #1565c0;
            margin: 0;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .home-btn {
            background: #1565c0;
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
        .card {
            background: #fff;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            font-size: 14px;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }
        textarea {
            min-height: 80px;
            resize: vertical;
        }
        button {
            padding: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .primary {
            background: #1565c0;
            color: white;
            width: 100%;
        }
        .delete {
            background: #c62828;
            color: white;
        }
        .stars {
            color: #f9a825;
            font-size: 16px;
            margin-top: 3px;
        }
        .feedback-item {
            border-bottom: 1px solid #eee;
            padding: 12px 0;
        }
        .feedback-item:last-child {
            border-bottom: none;
        }
        small {
            color: #666;
            display: block;
            margin-top: 2px;
        }
    </style>
</head>
<body>

<div class="topbar">
    <h1>💬 Feedbacks</h1>
    <button class="home-btn" onclick="location.href='index.html'">
        <i class="fa fa-home"></i> Início
    </button>
</div>

<div class="card">
    <label>Nome do Profissional Avaliado</label>
    <input type="text" id="profissional_nome" placeholder="Ex: Gilberto Moreira">

    <label>Nome do Cliente</label>
    <input type="text" id="cliente" placeholder="Ex: João Silva">

    <label>Serviço Prestado</label>
    <input type="text" id="servico" placeholder="Ex: Pintura Residencial">

    <label>Avaliação (1 a 5 Estrelas)</label>
    <select id="nota">
        <option value="5">⭐⭐⭐⭐⭐ (Excelente)</option>
        <option value="4">⭐⭐⭐⭐ (Muito Bom)</option>
        <option value="3">⭐⭐⭐ (Bom)</option>
        <option value="2">⭐⭐ (Regular)</option>
        <option value="1">⭐ (Ruim)</option>
    </select>

    <label>Depoimento / Comentários</label>
    <textarea id="depoimento" placeholder="Escreva o feedback do cliente aqui..."></textarea>

    <label>Indicaria este profissional a um amigo?</label>
    <select id="indique_amigo">
        <option value="Sim">Sim, com certeza!</option>
        <option value="Talvez">Talvez</option>
        <option value="Não">Não recomendo</option>
    </select>

    <button class="primary" id="btnSalvar" onclick="salvarFeedback()">
        💾 Salvar Feedback
    </button>
</div>

<div class="card">
    <h3>📚 Histórico de Depoimentos (Nuvem)</h3>
    <div id="lista">Carregando depoimentos...</div>
</div>

<script>
// Dados de Acesso Direto do seu Supabase (as mesmas credenciais de sucesso do seu cadastro)
const SUPABASE_URL = "https://xzhcujtqrfesfcfbpmsi.supabase.co"; 
const SUPABASE_KEY = "sb_publishable_j-rMLNlkBhsi2nK6EVO8cg_fJJnI8-V";

// Carrega os feedbacks salvos assim que a página abre
window.addEventListener("DOMContentLoaded", () => {
    puxarFeedbacks();
});

// Função para SALVAR o feedback direto no Supabase
async function salvarFeedback() {
    const profissional_nome = document.getElementById("profissional_nome").value.trim();
    const cliente_nome = document.getElementById("cliente").value.trim();
    const servico_prestado = document.getElementById("servico").value.trim();
    const estrelas = document.getElementById("nota").value;
    const comentario = document.getElementById("depoimento").value.trim();
    const indique_a_um_amigo = document.getElementById("indique_amigo").value;

    if (!profissional_nome || !cliente_nome || !servico_prestado || !comentario) {
        alert("Por favor, preencha todos os campos do feedback.");
        return;
    }

    const btn = document.getElementById("btnSalvar");
    btn.disabled = true;
    btn.innerText = "⏳ Gravando na Nuvem...";

    try {
        const dadosFormulario = {
            profissional_nome,
            cliente_nome,
            servico_prestado,
            estrelas,
            comentario,
            indique_a_um_amigo
        };

        const response = await fetch(`${SUPABASE_URL}/rest/v1/cadastro_feedbacks`, {
            method: "POST",
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": `Bearer ${SUPABASE_KEY}`,
                "Content-Type": "application/json",
                "Prefer": "return=representation"
            },
            body: JSON.stringify([dadosFormulario])
        });

        if (!response.ok) {
            const erroTxt = await response.text();
            throw new Error(erroTxt);
        }

        alert("🎉 Feedback registrado e salvo com sucesso!");
        
        // Limpa apenas os dados do cliente e comentário para a próxima avaliação
        document.getElementById("cliente").value = "";
        document.getElementById("servico").value = "";
        document.getElementById("depoimento").value = "";
        
        // Atualiza a lista na tela com o novo registro
        puxarFeedbacks();

    } catch (error) {
        console.error(error);
        alert("Erro ao salvar no Supabase: " + error.message);
    } finally {
        btn.disabled = false;
        btn.innerText = "💾 Salvar Feedback";
    }
}

// Função para BUSCAR os feedbacks gravados na nuvem e renderizar no histórico
async function puxarFeedbacks() {
    const lista = document.getElementById("lista");

    try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/cadastro_feedbacks?order=created_at.desc`, {
            method: "GET",
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": `Bearer ${SUPABASE_KEY}`
            }
        });

        if (!response.ok) throw new Error("Não foi possível carregar o histórico.");

        const dados = await response.json();
        lista.innerHTML = "";

        if (dados.length === 0) {
            lista.innerHTML = "<p>Nenhum feedback cadastrado no momento.</p>";
            return;
        }

        dados.forEach(f => {
            const visualEstrelas = "⭐".repeat(parseInt(f.stars || f.estrelas || 5));
            lista.innerHTML += `
                <div class="feedback-item">
                    <b>Profissional:</b> ${f.profissional_nome || 'Não Informado'} <br>
                    <b>Cliente:</b> ${f.cliente_nome} <small>Serviço: ${f.servico_prestado}</small>
                    <div class="stars">${visualEstrelas}</div>
                    <p style="font-style: italic; color: #444; margin: 5px 0 2px 0;">"${f.comentario}"</p>
                    <small>👍 Indicou para amigo: <b>${f.indique_a_um_amigo || 'Sim'}</b></small>
                </div>
            `;
        });

    } catch (error) {
        lista.innerHTML = `<p style="color:red;">Erro ao atualizar histórico: ${error.message}</p>`;
    }
}
</script>

</body>
</html>
